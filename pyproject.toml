[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "francescope-ai"
version = "0.1.0"
description = "Agentic probabilistic forecasting of French living standards and well-being."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
    "lightgbm>=4.7.0",

    "pydantic>=2.10,<3",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "PyYAML>=6.0,<7",
    "polars>=1.0",
    "duckdb>=1.0",
    "certifi>=2025.0",
    "openpyxl>=3.1",
    "numpy>=2.0",
    "xarray>=2026.0",
    "netCDF4>=1.7",
    "shapely>=2.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.28,<1",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0.12",
    "types-shapely>=2.1",
    "types-xlrd>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["francescope"]
